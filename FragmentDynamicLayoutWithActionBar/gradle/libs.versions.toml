# Master version catalog for every project in this repository.
#
# Each project's gradle/libs.versions.toml is an identical copy of this file,
# so one edit here updates all of them. After editing, run:
#   tools/sync-versions.sh
#   tools/build-all.sh
#
# A project only uses the entries its app/build.gradle asks for; the rest
# are simply ignored.

[versions]
agp = "9.4.1"
googleServices = "4.5.0"
secretsGradlePlugin = "2.0.1"

# AndroidX
activity = "1.13.0"
appcompat = "1.8.0"
cardview = "1.0.0"
constraintlayout = "2.2.2"
core = "1.19.1"
drawerlayout = "1.2.0"
fragment = "1.9.1"
gridlayout = "1.1.0"
legacySupport = "1.0.0"
lifecycle = "2.11.0"
loader = "1.2.0"
localbroadcastmanager = "1.1.0"
navigation = "2.10.2"
preference = "1.2.1"
recyclerview = "1.4.0"
room = "2.8.5"
viewpager = "1.1.0"
wear = "1.4.0"
work = "2.12.0"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"

# Google
material = "1.14.0"
playServicesLocation = "21.4.0"
playServicesMaps = "20.1.0"
firebaseBom = "35.1.0"
# FirebaseUI 10.x is a Jetpack Compose rewrite with a different API; 9.1.1 is the
# latest View-based release, which is what the course's Java code uses.
firebaseUi = "9.1.1"

# Third party
androidYoutubePlayer = "13.1.0"
circleimageview = "3.1.0"
glide = "5.0.9"
# GraphView's last Maven Central release (4.2.2) depends on the old support library, which can't
# be used without Jetifier. This is the upstream master commit with the author-merged AndroidX
# migration (same API), built by JitPack.
graphview = "047769ac3f"
gson = "2.15.0"
# MPAndroidChart 3.2.0 drops ValueFormatter and 4.x is a Kotlin rewrite; the
# SimpleGraphDemo code is written against the 3.1.0 API.
mpandroidchart = "v3.1.0"
volley = "1.2.1"

[libraries]
# AndroidX
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
gridlayout = { group = "androidx.gridlayout", name = "gridlayout", version.ref = "gridlayout" }
legacy-support-v13 = { group = "androidx.legacy", name = "legacy-support-v13", version.ref = "legacySupport" }
lifecycle-common = { group = "androidx.lifecycle", name = "lifecycle-common", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
loader = { group = "androidx.loader", name = "loader", version.ref = "loader" }
localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
viewpager = { group = "androidx.viewpager", name = "viewpager", version.ref = "viewpager" }
wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }

# Google
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-database = { group = "com.google.firebase", name = "firebase-database" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
firebase-ui-auth = { group = "com.firebaseui", name = "firebase-ui-auth", version.ref = "firebaseUi" }
firebase-ui-database = { group = "com.firebaseui", name = "firebase-ui-database", version.ref = "firebaseUi" }

# Third party
android-youtube-player = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "androidYoutubePlayer" }
circleimageview = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleimageview" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
graphview = { group = "com.github.jjoe64", name = "GraphView", version.ref = "graphview" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
